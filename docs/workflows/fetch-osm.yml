# Fetch OpenStreetMap data for the game and commit it to data/osm/.
# Run it from the repo's Actions tab: "Fetch OSM" -> Run workflow. Optional inputs: area name and bbox (SOUTH,WEST,NORTH,EAST).
name: Fetch OSM
on:
  workflow_dispatch:
    inputs:
      name:
        description: Area name (file name in data/osm/)
        default: legon
      bbox:
        description: Bounding box SOUTH,WEST,NORTH,EAST (empty = default Legon box)
        default: ''
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch from Overpass
        run: |
          if [ -n "${{ inputs.bbox }}" ]; then node tools/fetch-osm.mjs --name "${{ inputs.name }}" --bbox "${{ inputs.bbox }}"; else node tools/fetch-osm.mjs --name "${{ inputs.name }}"; fi
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm
          git diff --cached --quiet && echo "No changes" || (git commit -m "Update OSM data (${{ inputs.name }})" && git push)
